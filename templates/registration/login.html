{% extends "base.html" %}
{% block content %}
<div class="panel">
  <h1>Log in</h1>
  <form method="post" class="stack">{% csrf_token %}
    {% for f in form %}<label>{{ f.label }}{{ f }}</label>{% endfor %}
    {% if form.errors %}<small class="err">Username or password is incorrect.</small>{% endif %}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
